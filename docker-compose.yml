services:
  # Media organizer with Docker Model Runner
  # DMR runs natively in Docker Desktop, no separate container needed!
  media-organizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: media-organizer
    user: "1000:1000"
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH to your media library}:/media
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - WORK_DIR=/media
      - DMR_URL=http://model-runner.docker.internal
      - DMR_MODEL=ai/qwen3-vl
    command: python3 /app/scripts/organize.py
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/config/library.db || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure:3
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

  # Scheduled runs (daily at 2 AM)
  media-organizer-cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: media-organizer-cron
    user: "1000:1000"
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH to your media library}:/media
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - WORK_DIR=/media
      - DMR_URL=http://model-runner.docker.internal
      - DMR_MODEL=ai/qwen3-vl
    restart: unless-stopped
    profiles:
      - cron
