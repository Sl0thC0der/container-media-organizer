[project]
name = "container-media-organizer"
version = "1.0.0"
description = "Automated media library organization using Docker Model Runner"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "requests>=2.31.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "mypy>=1.5.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "types-requests>=2.31.0",
]

[project.scripts]
media-organizer = "media_organizer.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--verbose"]
markers = [
    "integration: Integration tests (may be slow)",
    "performance: Performance tests (may be very slow)",
    "slow: Very slow tests (skip in CI)",
    "security: Security tests",
    "requires_dmr: Requires Docker Model Runner to be running",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
strict_optional = true

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]
